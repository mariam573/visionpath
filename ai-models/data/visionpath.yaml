# VisionPath starter detection dataset
# Keep public, permitted web, and consented phone captures in a versioned
# dataset tree. Lock grouped splits before model selection.

path: ../data
train: images/train
val: images/val
test: images/test

# Starter scope from the implementation plan. Door state, seat occupancy,
# stair geometry and distance are separate evaluated tasks.
nc: 7
names:
  0: person
  1: chair
  2: table
  3: door
  4: cell_phone
  5: keys_keyring
  6: backpack
